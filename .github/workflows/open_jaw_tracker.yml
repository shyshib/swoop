name: Open Jaw Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Swoop
        run: pip install .

      - name: Check Open Jaw price
        run: |
          python open_jaw_tracker.py > price.txt
          cat price.txt
          test -s price.txt

      - name: Send email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          email_address = "shyshib@gmail.com"
          body = Path("price.txt").read_text(encoding="utf-8").strip()

          if not body:
              raise RuntimeError("price.txt is empty")

          message = EmailMessage()
          message["Subject"] = "Daily Open Jaw flight price"
          message["From"] = email_address
          message["To"] = email_address
          message.set_content(body)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(email_address, os.environ["GMAIL_APP_PASSWORD"])
              smtp.send_message(message)
          PY
